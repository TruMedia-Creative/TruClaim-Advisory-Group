name: GitHub Pages deployment disabled

# The contact form requires the Vercel /api/contact serverless function. Keep this
# workflow manual and non-deploying so a static Pages build is not published by mistake.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unsupported-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Explain supported production target
        run: |
          echo "GitHub Pages is disabled for this project because it cannot serve /api/contact."
          echo "Deploy the site to Vercel after configuring the required server-side environment variables."
          exit 1
